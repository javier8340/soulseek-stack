# Generado por instalar.sh: los cambios aquí se pierden al reinstalar. Edita plantillas/soularr-config.ini.
# Basado en el config.ini de ejemplo de Soularr. Ojo: Soularr expande variables de entorno, así que
# un signo de dólar literal en un valor (por ejemplo, en ignored_users) hay que escribirlo doble.

[Lidarr]
api_key = ${LIDARR_API_KEY}
host_url = http://lidarr:8686
# Carpeta de descargas tal como la ve Lidarr (mismo volumen que /downloads de slskd y Soularr)
download_dir = /downloads
disable_sync = False

[Slskd]
api_key = ${SLSKD_API_KEY}
host_url = http://slskd:5030
url_base = /
download_dir = /downloads
delete_searches = False
stalled_timeout = 3600
remote_queue_timeout = 300

[Release Settings]
use_selected_lidarr_release = False
use_most_common_tracknum = True
allow_multi_disc = True
accepted_countries = Europe,Japan,United Kingdom,United States,[Worldwide],Australia,Canada,Spain
skip_region_check = False
accepted_formats = CD,Digital Media,Vinyl

[Search Settings]
search_timeout = 5000
maximum_peer_queue = 50
minimum_peer_upload_speed = 0
minimum_filename_match_ratio = 0.8
minimum_search_interval = 5
search_retry_wait_hours = 24
allowed_filetypes = ${SOULARR_ALLOWED_FILETYPES}
ignored_users = ${SOULARR_IGNORED_USERS}
album_prepend_artist = True
search_type = incrementing_page
number_of_albums_to_grab = ${SOULARR_ALBUMS_PER_RUN}
title_blacklist =
search_blacklist =
search_source = ${SOULARR_SEARCH_SOURCE}
failed_import_denylist = True
ignore_failed_users = True
failed_user_ignore_hours = 168

[Download Settings]
download_filtering = True
use_extension_whitelist = True
extensions_whitelist = lrc,cue,log
rename_download_folders = True

[Logging]
level = INFO
format = [%(levelname)s|%(module)s|L%(lineno)d] %(asctime)s: %(message)s
datefmt = %Y-%m-%dT%H:%M:%S%z
log_to_file = True
log_file = soularr.log
max_bytes = 1048576
backup_count = 3
